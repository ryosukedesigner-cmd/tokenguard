# Publishes integrations/tokenguard-python to PyPI as "tokenguard-client" with Trusted Publishing (OIDC, no token stored).
name: publish-pypi
on:
  workflow_dispatch:
  push:
    tags: ["py-v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: integrations/tokenguard-python
        run: python -m pip install --upgrade build && python -m build
      - name: Smoke test (import from the built wheel)
        working-directory: integrations/tokenguard-python
        run: pip install dist/*.whl && python -c "from tokenguard_client import TokenGuard, extract_address; assert extract_address('x DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263')"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/tokenguard-python/dist
